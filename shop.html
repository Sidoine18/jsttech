<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boutique Digitale | JS TECH</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.fedapay.com/checkout.js?v=1.1.7"></script>

    <style>
        body { background: #050811; color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        .header { text-align: center; padding: 60px 20px; background: linear-gradient(to bottom, #111827, #050811); }
        .container { padding: 20px 5%; max-width: 1200px; margin: auto; }
        
        .software-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 25px; 
        }
        
        .software-card {
            background: #111827;
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255,255,255,0.05);
            text-align: center;
            position: relative;
        }

        .soft-icon { font-size: 50px; margin-bottom: 20px; display: block; }
        h3 { font-size: 18px; margin-bottom: 10px; min-height: 50px; }
        .price-tag { color: #22c55e; font-size: 24px; font-weight: 800; margin-bottom: 20px; display: block; }
        
        .btn-pay { 
            background: #3b82f6; color: white; border: none; width: 100%; 
            padding: 15px; border-radius: 12px; font-weight: bold; font-size: 16px;
            cursor: pointer; transition: 0.3s;
        }
        .btn-pay:hover { background: #2563eb; }
        
        .back-home { position: absolute; top: 20px; left: 20px; color: #94a3b8; text-decoration: none; }
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> Retour</a>
        <h1 style="color: #ff914d;">JS TECH <span style="color:white">SHOP</span></h1>
        <p>Téléchargez vos outils de travail instantanément après paiement.</p>
    </div>

    <div class="container">
        <div class="software-grid" id="shopGrid">
            </div>
    </div>

    <script>
        // Tes données avec tes liens Drive
        const myProducts = [
            { name: "Microsoft Office 2019", price: 5000, link: "https://drive.google.com/drive/folders/1sPNDcM3cSVGFextsYcd2QFWL4UBaz8Pb?usp=drive_link", icon: "📊" },
            { name: "Sage 100 Gestion Commerciale", price: 5000, link: "https://drive.google.com/drive/folders/1AgTL68jmc6eQEkn9iWiVwUPbKS1aRFTc?usp=drive_link", icon: "💼" },
            { name: "Pack BTP-ARCHITECTURE-ANIMATION", price: 5000, link: "https://drive.google.com/drive/folders/1FqaQqfTxELEdO09hh4zXhTnGaSuuAM10?usp=drive_link", icon: "🏗️" },
            { name: "KIT de 20 Formations + Bonus", price: 2500, link: "https://drive.google.com/drive/folders/1VPRrXUsDOPHlVWBzsaB6F8c_caqnAiQe?usp=drive_link", icon: "📚" },
            { name: "Pack complet Logiciels JS TECH", price: 5000, link: "https://drive.google.com/drive/folders/1XIpKHrt11AHGFf3rX9pVsxwwJEO0ipXr?usp=drive_link", icon: "💻" }
        ];

        function initShop() {
            const grid = document.getElementById('shopGrid');
            
            myProducts.forEach((p, index) => {
                const btnId = `pay-btn-${index}`;
                
                grid.innerHTML += `
                    <div class="software-card">
                        <span class="soft-icon">${p.icon}</span>
                        <h3>${p.name}</h3>
                        <span class="price-tag">${p.price.toLocaleString()} FCFA</span>
                        <button class="btn-pay" id="${btnId}">Payer & Télécharger</button>
                    </div>
                `;

                // Intégration FedaPay
                setTimeout(() => {
                    FedaPay.init(`#${btnId}`, {
                        public_key: 'pk_live_dQOtOaJEffaFdPJxNttW730u' , // <--- REMPLACEZ PAR VOTRE CLÉ FEDAPAY
                        transaction: {
                            amount: p.price,
                            description: "Achat " + p.name
                        },
                        onComplete: function(response) {
                            if (response.status === 'approved') {
                                alert("Paiement validé ! Redirection vers votre dossier Drive...");
                                window.location.href = p.link;
                            }
                        }
                    });
                }, 500);
            });
        }

        window.onload = initShop;
    </script>
</body>
</html>
