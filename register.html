<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pass Elite | JS TECH</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    

    <style>
        :root { --accent: #ff914d; --primary: #3b82f6; --dark: #0a0f1d; --card: #161e2d; }
        body { background: var(--dark); color: white; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        
        .reg-card { 
            background: var(--card); padding: 40px; border-radius: 30px; width: 100%; max-width: 450px; 
            border: 1px solid rgba(255, 255, 255, 0.1); text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
        }

        #myLogo { width: 90px; margin-bottom: 15px; filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.3)); }

        h2 { font-size: 26px; margin: 10px 0; background: linear-gradient(to right, #fff, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .form-group { text-align: left; margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; color: #94a3b8; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        
        input, select { 
            width: 100%; padding: 14px; background: rgba(15, 23, 42, 0.8); border: 1px solid #334155; 
            border-radius: 12px; color: white; box-sizing: border-box; font-size: 15px; transition: 0.3s;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); outline: none; }

        .btn-submit { 
            width: 100%; padding: 18px; background: linear-gradient(135deg, var(--accent), #f97316); 
            color: #000; border: none; border-radius: 12px; font-weight: 900; cursor: pointer; 
            font-size: 16px; margin-top: 15px; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s;
        }
        .btn-submit:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(255, 145, 77, 0.4); }

        #qrcode { display: none; }
        .success-area { display: none; padding: 20px; }
    </style>
</head>
<body>

    <div class="reg-card">
        <div id="form-ui">

            <a href="index.html" class="btn-home-luxury">
    <svg class="icon-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
    </svg>
    <span>Accéder à l'accueil</span>
</a>

<style>
    /* Style Luxury pour le bouton Accueil */
    .btn-home-luxury {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: #94a3b8; /* Couleur de texte discrète par défaut */
        text-decoration: none;
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        padding: 8px 16px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.03); /* Fond très légèrement transparent */
        border: 1px solid rgba(255, 255, 255, 0.05);
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Animation fluide */
        margin-bottom: 25px; /* Espace sous le bouton */
    }

    /* Animation de l'icône flèche */
    .icon-arrow {
        transition: transform 0.4s ease;
    }

    /* Effets au survol (Hover) */
    .btn-home-luxury:hover {
        color: #fff; /* Le texte devient blanc */
        background: rgba(59, 130, 246, 0.1); /* Fond bleu très transparent */
        border-color: rgba(59, 130, 246, 0.3); /* Bordure bleue */
        transform: translateY(-2px); /* Légère élévation */
        box-shadow: 0 5px 15px rgba(59, 130, 246, 0.15); /* Ombre portée bleue douce */
    }

    /* Animation de la flèche au survol */
    .btn-home-luxury:hover .icon-arrow {
        transform: translateX(-4px); /* La flèche bouge vers la gauche */
    }
</style>
            <h2>Accès Étudiant</h2>
            <p style="color: #64748b; margin-bottom: 30px;">Générez votre carte officielle JS TECH.</p>
            
            <form id="regForm">
                <div class="form-group">
                    <label>Nom & Prénoms</label>
                    <input type="text" id="name" placeholder="Ex: Elysée SOHOUNGBLE" required>
                </div>
                <div class="form-group">
                    <label>Email Professionnel</label>
                    <input type="email" id="email" placeholder="etudiant@domaine.com" required>
                </div>
                <div class="form-group">
                    <label>WhatsApp</label>
                    <input type="tel" id="tel" placeholder="+229 01 00 00 00" required>
                </div>
                <div class="form-group">
                    <label>Formation</label>
                    <select id="course_select">
                        <option value="Maintenance Informatique">Maintenance Informatique</option>
                        <option value="Bureautique Pro">Bureautique Pro</option>
                        <option value="Infographie & Design">Infographie & Design</option>
                    </select>
                </div>
                <button type="submit" id="btnTxt" class="btn-submit">OBTENIR MON PASS ELITE</button>
            </form>
        </div>

        <div id="qrcode"></div>

        <div id="success-ui" class="success-area">
            <div style="font-size: 70px; margin-bottom: 20px;">🎖️</div>
            <h3 style="color: var(--accent);">Inscription Validée !</h3>
            <p>Le Pass a été généré avec succès.</p>
            <button onclick="location.reload()" style="background:transparent; border:1px solid #444; color:#94a3b8; padding:10px 20px; border-radius:10px; cursor:pointer; margin-top:20px;">Nouvelle Inscription</button>
        </div>
    </div>

    <script>
        const { jsPDF } = window.jspdf;

        document.getElementById('regForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('btnTxt');
            btn.innerText = "CRÉATION DU PASS...";
            btn.disabled = true;

            const nom = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const tel = document.getElementById('tel').value;
            const formation = document.getElementById('course_select').value;
            const idKey = "JST-" + Math.floor(1000 + Math.random() * 9000);
            const dateStr = new Date().toLocaleDateString('fr-FR');

            // Après avoir généré le PDF, on envoie à la base de données
function saveToDB(nom, email, tel, formation) {
    db.collection("inscriptions").add({
        nom: nom,
        email: email,
        tel: tel,
        formation: formation,
        date: new Date().toLocaleString('fr-FR'),
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
    })
    .then(() => console.log("Enregistré dans la base de données !"))
    .catch((error) => console.error("Erreur: ", error));
}

            // 1. Générer le QR Code (On enlève les accents pour le texte du QR pour éviter les erreurs)
            const qrcodeDiv = document.getElementById("qrcode");
            qrcodeDiv.innerHTML = ""; 
            const qrSafeText = `ID:${idKey}|NAME:${nom.normalize("NFD").replace(/[\u0300-\u036f]/g, "")}`;
            
            new QRCode(qrcodeDiv, { text: qrSafeText, width: 160, height: 160 });

            setTimeout(() => {
                const qrCanvas = qrcodeDiv.querySelector('canvas');
                const qrImage = qrCanvas.toDataURL("image/png");
                
                // Récupération sécurisée du logo
                let logoData = null;
                const logoImg = document.getElementById('myLogo');
                try {
                    const canvas = document.createElement("canvas");
                    canvas.width = logoImg.naturalWidth;
                    canvas.height = logoImg.naturalHeight;
                    canvas.getContext("2d").drawImage(logoImg, 0, 0);
                    logoData = canvas.toDataURL("image/png");
                } catch(e) { console.log("Logo non disponible pour le PDF"); }

                generateLuxuryPDF(nom, email, tel, formation, idKey, dateStr, qrImage, logoData);
            }, 800);
        });

        function generateLuxuryPDF(nom, email, tel, formation, id, date, qr, logo) {
            const doc = new jsPDF();

            // --- FOND & DESIGN ---
            doc.setFillColor(10, 15, 29); // Dark background
            doc.rect(0, 0, 210, 297, 'F');

            // Header Dégradé simulé
            doc.setFillColor(30, 41, 59);
            doc.rect(0, 0, 210, 60, 'F');
            
            // Ligne d'accent orange
            doc.setFillColor(255, 145, 77);
            doc.rect(0, 60, 210, 2, 'F');

            // Logo
            if (logo) { doc.addImage(logo, 'PNG', 15, 12, 35, 35); }

            // Titre Enterprise
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(26);
            doc.setFont("helvetica", "bold");
            doc.text("JS TECH SERVICES", 60, 32);
            doc.setFontSize(10);
            doc.setFont("helvetica", "normal");
            doc.setTextColor(148, 163, 184);
            doc.text("L'EXCELLENCE NUMÉRIQUE & FORMATION PRO", 60, 40);

            // Titre du Document
            doc.setTextColor(255, 145, 77);
            doc.setFontSize(20);
            doc.setFont("helvetica", "bold");
            doc.text("CARTE D'ACCÈS ÉTUDIANT", 105, 85, { align: "center" });

            // Carte d'identité visuelle
            doc.setFillColor(22, 30, 45);
            doc.roundedRect(20, 100, 170, 110, 8, 8, 'F');
            doc.setDrawColor(59, 130, 246);
            doc.setLineWidth(0.5);
            doc.roundedRect(20, 100, 170, 110, 8, 8, 'S');

            // Infos
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(11);
            let y = 125;
            const labels = ["NOM COMPLET", "NUMÉRO WhatsApp", "EMAIL", "FORMATION", "ID MEMBRE"];
            const values = [nom.toUpperCase(), tel, email, formation, id];

            for(let i=0; i<labels.length; i++) {
                doc.setTextColor(148, 163, 184);
                doc.setFont("helvetica", "normal");
                doc.text(labels[i] + " :", 35, y);
                doc.setTextColor(255, 255, 255);
                doc.setFont("helvetica", "bold");
                doc.text(String(values[i]), 85, y);
                y += 14;
            }

            // QR CODE (Placé comme un sceau de sécurité)
            doc.setFillColor(255, 255, 255);
            doc.roundedRect(145, 145, 35, 35, 3, 3, 'F');
            doc.addImage(qr, 'PNG', 147, 147, 31, 31);
            
            // Footer Info
            doc.setTextColor(148, 163, 184);
            doc.setFontSize(9);
            doc.setFont("helvetica", "italic");
            doc.text(`Fait à Bohicon, le ${date}`, 105, 230, { align: "center" });
            
            doc.setFont("helvetica", "normal");
            doc.text("Cette carte est personnelle et obligatoire pour l'accès aux salles.", 105, 260, { align: "center" });
            doc.setTextColor(59, 130, 246);
            doc.text("www.jstech-benin.com", 105, 270, { align: "center" });

            // Sauvegarde sécurisée (nettoyage du nom pour le fichier)
            const safeFileName = nom.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '_');
            doc.save(`Pass_JSTECH_${safeFileName}.pdf`);

            document.getElementById('form-ui').style.display = 'none';
            document.getElementById('success-ui').style.display = 'block';
        }
    </script>
</body>
</html>
