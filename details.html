<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détails de la Formation | JS TECH</title>
    <style>
        :root {
            --primary-blue: #0056b3;
            --accent-orange: #ff914d;
            --dark-bg: #0a0f1d;
            --card-bg: #161e2d;
            --text-light: #cbd5e1;
            --white: #ffffff;
        }

        body {
            background: var(--dark-bg);
            color: var(--white);
            font-family: 'Segoe UI', sans-serif;
            line-height: 1.6;
            margin: 0;
        }

        header {
            padding: 20px 8%;
            background: rgba(10, 15, 29, 0.9);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .btn-back {
            color: var(--white);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .detail-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 40px;
            border: 1px solid rgba(255, 145, 77, 0.2);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .category-badge {
            background: var(--primary-blue);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            text-transform: uppercase;
            font-weight: bold;
        }

        h1 { font-size: 36px; margin: 20px 0; color: var(--accent-orange); }

        .price-big {
            font-size: 28px;
            font-weight: 800;
            color: var(--white);
            margin-bottom: 30px;
            display: block;
        }

        .program-section {
            background: rgba(255,255,255,0.03);
            padding: 25px;
            border-radius: 12px;
            margin: 30px 0;
        }

        .program-list { list-style: none; padding: 0; }
        .program-list li {
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .program-list li::before { content: "▹"; color: var(--accent-orange); font-weight: bold; }

        .cta-box {
            display: flex;
            gap: 20px;
            margin-top: 40px;
        }

        .btn-register {
            background: var(--accent-orange);
            color: var(--dark-bg);
            padding: 15px 40px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 800;
            flex: 1;
            text-align: center;
            transition: 0.3s;
        }

        .btn-whatsapp {
            background: #25d366;
            color: white;
            padding: 15px 40px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 800;
            flex: 1;
            text-align: center;
        }

        .btn-register:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(255, 145, 77, 0.3); }

        @media (max-width: 600px) {
            .cta-box { flex-direction: column; }
        }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="btn-back">← Retour à l'accueil</a>
    <img src="jst-service-logo.png" alt="Logo" height="40">
</header>

<div class="container">
    <div id="content" class="detail-card">
        <p>Chargement des détails...</p>
    </div>
</div>

<script>
    // Base de données des détails de formations
    const database = {
        "initiation": {
            titre: "Initiation Informatique",
            categorie: "Base",
            prix: "45 000 FCFA",
            description: "Idéal pour les débutants de tout âge. Apprenez à utiliser un ordinateur sans stress.",
            programme: ["Découverte de l'unité centrale et périphériques", "Utilisation de la souris et du clavier", "Gestion des dossiers et fichiers", "Navigation internet sécurisée"]
        },
        "bureautique": {
            titre: "Pack Bureautique Expert",
            categorie: "Professionnel",
            prix: "75 000 FCFA",
            description: "Maîtrisez les outils indispensables en entreprise.",
            programme: ["Microsoft Word : Mise en page pro", "Microsoft Excel : Tableaux et calculs", "PowerPoint : Présentations dynamiques", "Gestion des emails et cloud"]
        },
        "maintenance": {
            titre: "Maintenance & Réseaux",
            categorie: "Technique",
            prix: "120 000 FCFA",
            description: "Devenez le technicien dont toutes les entreprises ont besoin.",
            programme: ["Architecture des ordinateurs", "Diagnostic de pannes matérielles", "Installation de systèmes (Windows/Linux)", "Configuration de réseaux locaux et Wi-Fi"]
        },
        "promo-vacances": {
            titre: " Promo Vacances TIC",
            categorie: "Saisonnier",
            prix: "25 000 FCFA",
            description: "Formation intensive pour booster votre niveau durant les vacances.",
            programme: ["Initiation rapide aux TIC", "Bases de la bureautique", "Recherche efficace sur Internet", "Atelier pratique de création de documents"]
        }
    };

    // Récupération de l'ID dans l'URL
    const urlParams = new URLSearchParams(window.location.search);
    const formationId = urlParams.get('id');
    const formation = database[formationId];

    const contentDiv = document.getElementById('content');

    if (formation) {
        contentDiv.innerHTML = `
            <span class="category-badge">${formation.categorie}</span>
            <h1>${formation.titre}</h1>
            <span class="price-big">${formation.prix}</span>
            <p>${formation.description}</p>
            
            <div class="program-section">
                <h3>📋 Au programme :</h3>
                <ul class="program-list">
                    ${formation.programme.map(item => `<li>${item}</li>`).join('')}
                </ul>
            </div>

            <div class="cta-box">
                <a href="https://wa.me/2290191144344?text=Je%20souhaite%20m'inscrire%20à%20la%20formation%20:%20${formation.titre}" class="btn-whatsapp">S'inscrire via WhatsApp</a>
                <a href="register.html" class="btn-register">S'inscrire en ligne</a>
            </div>
        `;
    } else {
        contentDiv.innerHTML = `<h1>Oups !</h1><p>Formation non trouvée. Veuillez revenir à l'accueil.</p>`;
    }
</script>

</body>
</html>
